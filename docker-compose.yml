services:
  backend:
    build:
      context: ./backend
    container_name: genai-a1-backend
    environment:
      MODEL_DIR: /app/models/onnx
      MAX_UPLOAD_BYTES: "10485760"
    volumes:
      # models stay outside the image: rebuilding does not mean re-copying
      # several hundred megabytes of weights
      - ./models/onnx:/app/models/onnx:ro
    ports:
      - "8000:8000"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    container_name: genai-a1-frontend
    depends_on:
      - backend
    ports:
      - "3000:80"
    restart: unless-stopped
