[build-system]
requires = ["setuptools>=78"]
build-backend = "setuptools.build_meta"

[project]
name = "restoration-lab"
version = "0.1.0"
description = "Generative AI assignment: restoration routing and style-conditioned sketches"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
include = ["restoration*", "backend*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
